<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Library">
<meta name="application-name" content="Library">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<title>Library</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<style>
:root{
  --bg:#0c0e13; --bg2:#12151c; --surface:#171b24; --surface2:#1f2431; --line:#2a3040;
  --text:#e9edf5; --muted:#8e97ab; --faint:#5b6478; --accent:#7aa2ff; --accent2:#5d86ef;
  --danger:#ff5f57; --ok:#4fd28a; --warn:#ffb84a;
  --radius:14px; --tile:22%;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --sal:env(safe-area-inset-left); --sar:env(safe-area-inset-right);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
html{height:100%}
body{
  min-height:100%; font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none; -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
}
body.stage-open{overflow:hidden;position:fixed;inset:0}
body.lock{overflow:hidden;position:fixed;left:0;right:0;width:100%} /* top is set inline to -scrollY */
input,textarea,select,button{font:inherit;color:inherit}
input,textarea,select{font-size:16px;-webkit-user-select:text;user-select:text} /* ≥16px stops iOS from zooming on focus */
input,textarea{-webkit-appearance:none;appearance:none;border-radius:0}
input[type=search]::-webkit-search-decoration,input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}
button{cursor:pointer}
a{color:var(--accent)}
img{max-width:100%}
.hidden{display:none !important}
.sr{position:absolute;left:-9999px}

/* ---------- Home ---------- */
#home{padding:calc(var(--sat) + 12px) calc(var(--sar) + 16px) calc(var(--sab) + 96px) calc(var(--sal) + 16px);}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 0 10px}
.topbar h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0;flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.topbar h1 .crumb{color:var(--muted);font-weight:600;font-size:16px}
.topbar h1 .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);color:var(--text);display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.iconbtn:active{background:var(--surface2)}
.iconbtn.primary{background:var(--accent);color:#0a0f1e;font-weight:800;font-size:24px}
.pill{border:0;background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.pill:active{background:var(--surface2)}
.pill.on{background:var(--accent);color:#0a0f1e}
.searchrow{display:flex;gap:8px;margin-bottom:12px}
.searchrow input{flex:1;background:var(--surface);border:1px solid transparent;border-radius:12px;padding:10px 12px;color:var(--text);outline:none;min-width:0}
.searchrow input:focus{border-color:var(--line)}
.searchrow input::placeholder{color:var(--faint)}
.sortrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.sortrow::-webkit-scrollbar{display:none}

.running{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#1c2437,#161b28);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:14px}
.running .ic{width:38px;height:38px;border-radius:10px;overflow:hidden;flex:none;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:20px}
.running .ic .letter{font-size:18px;font-weight:800}
.running .ic img{width:100%;height:100%;object-fit:cover;display:block}
.running .txt{flex:1;min-width:0}
.running .txt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.running .txt span{font-size:12px;color:var(--ok)}
.running button{border:0;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px}
.running .resume{background:var(--accent);color:#0a0f1e}
.running .quit{background:var(--surface2);color:var(--text)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:18px 10px;align-items:start}
.tile{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--text);width:100%;position:relative;-webkit-touch-callout:none;touch-action:manipulation}
.tile:active .ic{transform:scale(.94);filter:brightness(.85)}
.tile .ic{width:64px;height:64px;border-radius:var(--tile);overflow:hidden;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:32px;transition:transform .12s;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.tile .ic img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.tile .ic .letter{font-weight:800;font-size:28px;letter-spacing:-.02em}
.tile .ic.folder{background:rgba(255,255,255,.10);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:9px}
.tile .ic.folder .mini{border-radius:6px;overflow:hidden;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:12px}
.tile .ic.folder .mini img{width:100%;height:100%;object-fit:cover}
.tile .ic.folder .mini .letter{font-size:11px;font-weight:800}
.tile .lbl{font-size:11.5px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#dfe5f0}
.tile .dot{position:absolute;top:-3px;right:calc(50% - 32px - 3px);width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--bg)}
.tile .more{position:absolute;top:-6px;left:calc(50% - 32px - 8px);width:22px;height:22px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);color:var(--text);font-size:14px;line-height:20px;text-align:center;display:none}
body.edit .tile .more{display:block}
body.edit .tile .ic{animation:wiggle .35s ease-in-out infinite alternate}
@keyframes wiggle{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}

.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty .big{font-size:56px;margin-bottom:10px}
.empty b{color:var(--text)}
.empty p{max-width:320px;margin:8px auto}

.banner{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:flex-start}
.banner b{color:var(--text)}
.banner .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:0 2px}

/* ---------- Stage (running app) ---------- */
#stage{position:fixed;top:0;left:0;width:var(--vpw,100vw);height:var(--vph,100dvh);z-index:50;background:#000;display:flex;flex-direction:column;visibility:hidden;pointer-events:none;overflow:hidden}
#stage.on{visibility:visible;pointer-events:auto}
/* Padding is top/sides only — the bottom is always full-bleed so apps reach the screen edge. */
#stage.pad{padding:var(--sat) var(--sar) 0 var(--sal)}
#frameWrap{flex:1;min-height:0;position:relative}
#stage.rot #frameWrap{position:absolute;flex:none}
/* width/height:1px + min-*:100% is the iOS iframe sizing hack; it stops WebKit sizing the frame to its content. */
#frameWrap iframe{position:absolute;top:0;left:0;width:1px;min-width:100%;height:1px;min-height:100%;border:0;display:block;background:#000}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--bg);color:var(--muted);font-size:13px;transition:opacity .25s;z-index:2}
#loading.off{opacity:0;pointer-events:none}
#loading .ic{width:72px;height:72px;border-radius:22%;overflow:hidden;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:36px}
#loading .ic img{width:100%;height:100%;object-fit:cover}
#loading .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#homeBtn{position:fixed;z-index:60;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(20,22,30,.62);color:#fff;font-size:20px;display:none;align-items:center;justify-content:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 2px 12px rgba(0,0,0,.45);opacity:.85;transition:opacity .3s;touch-action:none;padding:0}
#homeBtn.on{display:flex}
#homeBtn.dim{opacity:.38}
#homeBtn.drag{opacity:1;transform:scale(1.08)}
#stage .fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);text-align:center;padding:24px}

/* ---------- Sheets & modals ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;touch-action:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:101;background:var(--bg2);border-radius:20px 20px 0 0;max-height:calc(100% - var(--sat) - 20px - var(--kb,0px));display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--sab);padding-left:var(--sal);padding-right:var(--sar)}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 4px;flex:none}
.sheet .hd{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;flex:none}
.sheet .hd h2{margin:0;font-size:18px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .bd{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 16px;flex:1;min-height:0;overscroll-behavior:contain;touch-action:pan-y}
.sheet .close{background:var(--surface);border:0;color:var(--muted);width:32px;height:32px;border-radius:50%;font-size:16px}
.section{background:var(--surface);border-radius:14px;margin-bottom:12px;overflow:hidden}
.section .row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:46px}
.section .row:last-child{border-bottom:0}
.section .row .k{flex:1;min-width:0}
.section .row .k small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.section .row .v{color:var(--muted);font-size:14px;text-align:right;white-space:nowrap}
.section .row.btn{cursor:pointer;color:var(--accent);font-weight:600}
.section .row.btn:active{background:var(--surface2)}
.section .row.btn.danger{color:var(--danger)}
.section .row input[type=text],.section .row input[type=url]{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--text);outline:none;min-width:0}
.section .row select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--text);max-width:55%}
.section .row .chev{color:var(--faint)}
.seg{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
.seg button.on{background:var(--surface2);color:var(--text)}
.switch{position:relative;width:48px;height:29px;border-radius:15px;background:var(--line);border:0;flex:none;transition:background .2s;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(19px)}
.apphead{display:flex;align-items:center;gap:14px;padding:6px 2px 14px}
.apphead .ic{width:74px;height:74px;border-radius:22%;overflow:hidden;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:38px;flex:none;position:relative}
.apphead .ic img{width:100%;height:100%;object-fit:cover}
.apphead .ic .letter{font-weight:800;font-size:32px}
.apphead .ic .edit{position:absolute;right:0;bottom:0;left:0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;text-align:center;padding:2px 0;font-weight:700;letter-spacing:.04em}
.apphead .meta{flex:1;min-width:0}
.apphead .meta input{width:100%;background:var(--surface);border:1px solid transparent;border-radius:10px;padding:8px 10px;font-size:17px;font-weight:700;color:var(--text);outline:none}
.apphead .meta input:focus{border-color:var(--line)}
.apphead .meta small{display:block;color:var(--muted);font-size:12px;margin-top:6px}
.bigbtn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px;background:var(--accent);color:#0a0f1e;margin-bottom:12px}
.bigbtn:active{background:var(--accent2)}
.bigbtn.secondary{background:var(--surface);color:var(--text)}
.bigbtn.danger{background:rgba(255,95,87,.14);color:var(--danger)}
.bigbtn:disabled{opacity:.5}
textarea.paste{width:100%;min-height:160px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--text);font:16px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical;outline:none}
.hint{font-size:12.5px;color:var(--muted);margin:6px 2px 12px}
.hint code,.codebox code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--bg);padding:1px 5px;border-radius:5px}
.codebox{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;overflow:auto}
.codebox pre{margin:0;font:11.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;color:#c9d3e6;-webkit-user-select:text;user-select:text}
.codebox .copy{position:absolute;top:8px;right:8px;border:0;background:var(--surface2);color:var(--text);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700}
.bar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden;display:flex;margin:6px 0 4px}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stlist .row .ic{width:30px;height:30px;border-radius:8px;overflow:hidden;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.stlist .row .ic img{width:100%;height:100%;object-fit:cover}
.stlist .row .ic .letter{font-size:13px;font-weight:800}
.iconpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:4px 0 12px}
.iconpick button{background:var(--surface);border:0;border-radius:12px;padding:12px 6px;color:var(--text);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.iconpick button span{font-size:22px}
.emojirow{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.emojirow input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:22px;text-align:center;color:var(--text);outline:none}

/* ---------- Dialog (confirm/prompt) ---------- */
.dialog{position:fixed;left:50%;top:calc(50% - var(--kb,0px) / 2);transform:translate(-50%,-50%) scale(.96);width:min(320px,calc(100% - var(--sal) - var(--sar) - 48px));background:var(--bg2);border-radius:18px;z-index:201;padding:18px 16px 12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.dialog.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.dialog h3{margin:0 0 6px;font-size:17px}
.dialog p{margin:0 0 14px;color:var(--muted);font-size:14px;white-space:pre-line}
.dialog input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--text);outline:none;margin-bottom:12px}
.dialog .btns{display:flex;flex-direction:column;gap:6px}
.dialog .btns button{border:0;border-radius:11px;padding:11px;font-weight:700;background:var(--surface);color:var(--text)}
.dialog .btns button.primary{background:var(--accent);color:#0a0f1e}
.dialog .btns button.danger{color:var(--danger)}
.dialog .btns button.plain{background:transparent;color:var(--muted);font-weight:600}
#scrim2{z-index:200}

/* ---------- Toast ---------- */
/* Full-bleed test overlay — draws the true edges of the web view. */
#vptest{position:fixed;top:0;left:0;width:var(--vpw,100vw);height:var(--vph,100dvh);z-index:500;display:none;
  background:#1b0f2b;border:3px solid #ff2fd0;color:#fff;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
  flex-direction:column;align-items:stretch;text-align:center;overflow:hidden}
#vptest.on{display:flex}
#vptest .band{background:rgba(80,255,140,.30);border-bottom:1px dashed #50ff8c;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;min-height:1px}
#vptest .band.bot{border-bottom:0;border-top:1px dashed #50ff8c}
#vptest .top{height:var(--sat)}
#vptest .bot{height:var(--sab)}
#vptest .mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;overflow:auto}
#vptest pre{margin:0;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:left;-webkit-user-select:text;user-select:text}
#vptest .verdict{font-weight:700;font-size:14px;max-width:320px}
#vptest .ok{color:#7dffb0}
#vptest .bad{color:#ffb84a}
#vptest button{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:#ff2fd0;color:#1b0f2b}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 24px);transform:translate(-50%,20px);background:#262c3a;color:#fff;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:600;z-index:300;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:calc(100% - 40px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.action{pointer-events:auto}
#toast button{background:none;border:0;color:var(--accent);font-weight:800;margin-left:8px}

.fab{position:fixed;right:calc(var(--sar) + 18px);bottom:calc(var(--sab) + 18px);z-index:40;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#0a0f1e;font-size:30px;font-weight:800;box-shadow:0 8px 24px rgba(122,162,255,.35);display:flex;align-items:center;justify-content:center;line-height:1;padding:0 0 3px}
.fab:active{background:var(--accent2)}
</style>
</head>
<body>

<main id="home">
  <div class="topbar">
    <h1 id="title"><span class="name">Library</span></h1>
    <button class="pill" id="storagePill" title="Storage">…</button>
    <button class="iconbtn" id="editBtn" title="Edit">✎</button>
    <button class="iconbtn" id="settingsBtn" title="Settings">⚙︎</button>
  </div>
  <div id="installBanner" class="banner hidden">
    <div>📲</div>
    <div><b>Install this Library</b><br>In Safari tap <b>Share</b> → <b>Add to Home Screen</b>. Then open it from your Home Screen so it works offline and keeps its storage.</div>
    <button class="x" id="installBannerX">×</button>
  </div>
  <div id="runningBar" class="running hidden">
    <div class="ic" id="runningIcon"></div>
    <div class="txt"><b id="runningName"></b><span id="runningSub">Running in background</span></div>
    <button class="resume" id="resumeBtn">Resume</button>
    <button class="quit" id="quitBtn">Quit</button>
  </div>
  <div class="searchrow">
    <input id="search" type="search" placeholder="Search apps" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  </div>
  <div class="sortrow" id="sortRow">
    <button class="pill" data-sort="recent">Recent</button>
    <button class="pill" data-sort="name">Name</button>
    <button class="pill" data-sort="added">Added</button>
    <button class="pill" id="newFolderBtn">＋ Folder</button>
  </div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty hidden">
    <div class="big">📚</div>
    <b>No apps yet</b>
    <p>Tap <b>＋</b> to import an .html file from your phone. It'll be saved here and work offline.</p>
  </div>
</main>
<button class="fab" id="addBtn" title="Add app">＋</button>

<!-- running app -->
<div id="stage">
  <div id="frameWrap">
    <div id="loading"><div class="ic" id="loadingIcon"></div><div class="spin"></div><div id="loadingName"></div></div>
  </div>
</div>
<button id="homeBtn" title="Back to Library">⌂</button>

<!-- sheets -->
